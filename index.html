
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dreamscape</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>
<div class="cosmos">
    <div class="orbit">
        <div class="planet"></div>
    </div>

    <div class="moon"></div>
</div>
    <main class="container">

        <p class="subtitle">WELCOME TO</p>

        <h1>Dreamscape</h1>

        <p class="description">
            Somewhere between dreams and reality.
        </p>

        <button onclick="enterUniverse()">
            Enter My Universe ✦
        </button>

        <p id="message"></p>

    </main>
<section id="secondPage" class="second-page">

    <p class="subtitle">in the midle of night </p>

    <h2>welcome the dreamers</h2>

    <img src="foto.jpg" class="dream-photo" alt="Dreamscape">
    
    <div class="music-player">
    <p>🎵 A song for you</p>

    <audio controls>
        <source src="lagu.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung audio.
    </audio>

    </div>
    <p class="second-text">
        Every star has a story.
        Every dream has a destination.
    </p>

    <div class="sparkle">✦ ✧ ✦</div>

    <p class="final-message">
        Somewhere in this endless universe,
        there is always a beautiful beginning. 🌙
    </p>

    <button onclick="goBack()">
        Back to Earth ↩
    </button>

</section>
    <script src="script.js"></script>
<style>
html, body {
    overflow-y: auto !important;
    height: auto !important;
    min-height: 100%;
}
</style>
</body>
</html>
